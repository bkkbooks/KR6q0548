body:
  text: 嗣法門人續清等編青城法姪徹生梓行順治九年三月十三日川南道吳公諱登啓暨闔郡士庶等請師住瀘州方山雲峰禪寺三門十方無壁落四面亦無門且向甚麼處入卓拄杖喝一喝便進祖師九年冷坐禍出私門至今不了殃及兒孫一瓣黃檀觸碎鼻根佛殿喝一喝云佛之一字吾不喜聞如今事不獲已覿面相逢不免將錯就錯大展三拜方丈法空為座毗耶為室一任沒量人來到此易形改志當晚小參道真常而不渝事因時而自變當馬祖百丈法幢重建大振宗風如官商角徵無不俱作及近代以來叢林寂寞縱是黃鍾大呂音響杳絶佛日下衰幸遇蘭臺吳公德布川南弘護聖教請山僧住持此山激揚斯道起已墜之風作將來眼新雲峰有一韻不落宮商曲調試問諸人還有善和者麼一僧出作禮師作聽勢云依稀似曲才堪聽又被風吹別調中喝一喝下座結制上堂師詣座云燈王寶座不立纖塵大衆見麼其或踟蹰未免撒沙撒土去也遂升炷香云此一瓣香臥雲眠月冒雨經風本自天然不從人得爇向爐中供養三世諸佛歷代祖師惟冀新新恆泛渡人舟念念常懷未了願次拈云此一瓣香三賢莫曉十聖那知昔日埋沒壒𡒁堆頭今朝拈來人天座上祝延今上皇帝萬安滿朝文武闔國公卿遠近檀那現前大衆惟願堯風再扇舜日重明再拈云此一瓣香萬峰十載歷盡艱辛火爐頭邊親蒙付囑爇向爐中供養見住夔州府梁山縣萬峰山太平禪寺傳曹溪正脈三十五世破山本師明和尚用酬法乳之恩斂衣趺坐上首白槌云法筵龍象衆當觀第一義師云不沐煙波不挂幡日長無事睡齁鼾翻然來作孤舟客惟喜金鱗上釣竿有麼問答罷乃云昔年古寺成幽靘今日翻為選佛場朽柱敗椽齊側耳泥團瓦礫盡生光如是則知盡世界山河大地草木叢林纖毫縷結塵塵剎剎一時成佛去也衆中還有心空及第者麼一僧出作禮師云將謂拋磚引玉原來只引得箇土墼子上首結槌云諦觀法王法法王法如是下座上堂問如何是第一義師便打僧大笑師復打問知何是雲峰頂師云雪霽山頭雲漫漫進云如何是深深處師云溪聲流處水潺潺乃云此事若向鐘鼓未鳴以前薦得略較些子只待登曲彔木佻佻達達轉沒交涉何故是法不可示言辭相寂滅上堂事存函蓋合理應箭鋒拄去此二重關佛眼覷不著惟有拄杖子全身能擔荷卓一卓云今日錯下注腳上堂問不落昏沉不隨掉舉目前歷歷明明未審是學人入處否師云腳跟下好與三十棒進云古人道吹毛用了急須磨且道吹毛作麼生用師便打乃云若論第一義諦了無可觀既無可觀亦無可説無觀無説盡大地無一絲毫頭障礙無一絲毫頭分別雲峰只得向第二義門聊通一線以拄杖畫云大衆還知麼一僧云還有者箇在師云不因樵子徑爭到葛洪家新戒請上堂戒慧定三無漏學空假中一性圓明然雖如是金屑雖貴落眼成翳若向者裏見得徹去花街柳巷皆為淨戒如涉纖疑十重四十八輕一齊俱犯解制上堂問語默涉離微如何通不犯師搖手云犯也問昔日世尊拈花迦葉微笑今日和尚不拈花學人不微笑以甚麼作將來正眼師豎拄杖云會麼進云紅日東升方覺曉兩重公案一拈花師云莫妄想乃卓拄杖云莫謂者裏沒生涯驀地相逢盡是他堪憐逐臭尋香者誰能謝卻眼中花若是眼裏無花且道燈籠與露柱鬥額三門騎佛殿升堂雪霽山拱手三堆子點頭又作麼生不見一法即如來方得名為觀自在結制上堂問穿衣喫飯的是誰師云難道汝自己也不識僧禮拜乃云十月十五聖制方來衲子齊立雲峰本無一法看來物物瞥地且道盞子落地碟子成七片汝等諸人作麼生會一僧喝一僧走出法堂師復云可憐不是當家子孤負蒼蒼兩道眉上堂問應物現形如水中月作麼生説箇現的道理師便打問十方同聚會箇箇學無為今日上堂是有為是無為師豎拄杖云試定當看乃云是法無形通貫十方目前現用人信不及便乃認名認句向文字中求意地下卜度天地懸殊卓拄杖云雪上加霜上堂問雲峰門庭即不問如何是堂奧中事師云你即今在甚麼處僧喝師云堂奧也不識問禪床上喝散白雲心地中掀翻大藏請問證據在甚麼處師便打乃云朔風颯颯沒遮攔吹得人人毛骨寒就裏一點藏不得只為當人作境觀所謂熱則普天匣地熱寒則普天匣地寒舉僧問古德學人被寒暑相侵向甚麼處回避德云寒時寒殺闍黎熱時熱殺闍黎雲峰今日不然寒也寒不殺熱也熱不殺卻被伊瞞殺上堂問和尚未出方丈學人早已領棒了也未審如何是升堂意旨師云再與三十問杲日當空時如何師云腳跟下橫三豎四進云不識路頭窮如何歸故鄉師打云過乃云道契則鄰不在身近居見聞之地見聞莫能及處思議之際思議莫能測雲峰今日不忍杜口只得無言説中顯言説無方便處設方便所謂言發非聲語不干舌治世語言資生業等皆與實相不相違背不立有無一句作麼生道撒手似君無一物徒勞謾説數千般解制上堂問出將入相的人如何管待師打乃云拈槌豎拂土上加堆結制安禪無繩自縛自從今日始不以佛聖為師隨處作主遇緣即宗腳跟下不被草鞋瞞切忌三千里外逢人不得錯舉結制上堂問杖頭有眼明如日如何是杖頭眼師云瞎進云不會師卓拄杖云且向者裏著乃云今朝十月十五無端打動法鼓露柱燈籠出班畫壁粉牆作舞看來多不著便不如且退長連床上各自嘴盧都復舉教中云若見諸相非相即見如來古德云若見諸相非相不見如來師云一人掘地覓天一人將曲作直雲峰道山河大地塵塵剎剎歷歷分明那箇是如來上堂問屏卻咽喉脣吻如何道得親切句師便打進云恁麼則瞎卻天下人眼去也師復打云瞎卻汝一箇乃云冬月初一日隆寒滿大地覿面不相饒豈能避得及避不及就裏幾人能瞥地上堂問猛虎以肉為食因甚不食其子師云自肉食不盡問古人睹桃花得悟今人睹和尚拄杖因甚不悟師云捧上不成龍乃云殺佛殺祖本分為人行棒行喝節外生枝所謂肥邊易得瘦處難求欲知恁麼事須是恁麼人既是恁麼人提持恁麼事便能隨處村歌社舞那管舜德堯仁以拄杖劃一劃云還委悉麼龍袖拂開全體現象王行處絶狐蹤上堂乃云大地輒寒霜灼灼露睛光只因資薦悼升座為舉揚茲乃本空上座薦弟天寵徐公且道徐公即今何在驀呈拄杖云會麼在山僧拄杖頭上現大人相示無住三昧若此見得過去不滅未來不生現在無住三際平等一性圓明遊戲天上人間信步三途六道去來無礙縱橫任性不離此箇三昧若涉纖疑即落陰界還知麼隨順世緣無罣礙涅槃生死等空花解制上堂問下元結制上元解制結即不無解後現前大衆問甚麼處去師云頭頂是天腳踏實地進云恁麼則空空蕩蕩去也師云只恐不是玉是玉也大奇乃云陽氣新添春日長紫燕聲聲繞畫梁分明底物不相借有何佛法可商量結制上堂問連對兩單人幾箇是知音師云是你不知音僧便喝師便打乃云干戈時節強安禪柴米油鹽事未便雖見苦空真寂寞千古靈機尚宛然驀呈拄杖云者箇是拄杖那箇是靈機向者裏明得始見自己立地處即見三世諸佛歷代祖師立地處盡世界山河大地明暗色空四生六道九種十類塵塵剎剎立地處可以攝大千沙界於一微塵於一毛端現寶王剎一道平沉方圓無際若信不及業識忙忙終無了日擊禪床下座解制上堂問一喝分賓主學人已喝了且道那裏是賓那裏是主師云賓主歷然僧喝師便打問九旬期畢如何是末後句師云福建人喫荔枝乃云三年聚首事無不知冷眼看來一場敗闕於中檢點得出亦任七縱八橫檢點不出常住裏有飯有粥拙溪邢太守薦嚴請上堂問數年尋人當面錯過而今尋著乃拉不脫時如何師云腦後欠一槌問啜茶打溼嘴喫飯沾牙齒還有參學分也無師云有進云也是鉢盂安柄師打問人生有形有相死後無瑕無影即今亡者在甚麼處師云雪霽山頭雲現嶂進云和尚莫瞞人師云是汝自瞞乃云來兮不觸張王姓去也何隨秋與冬分明一具黃金骨無奈時人逢不逢驀拈拄杖云還見聞源熊老大人於山僧拄杖頭上放光現瑞橫來豎去出沒自由證無相三昧也無若信得及不惟報達現前父母且天恩地恩君恩師恩過去父母九玄七祖一時報畢復卓拄杖云還知麼無邊剎海隨遊戲妙高峰頂任往還住江安縣蟠龍寺結制上堂問選佛場開人天交集凡聖同參佛法充滿現前佛法即不問如何是蟠龍重新一句師云潛水灣灣藏龍窟紅崖迥迥宿雲窩問古人拈花示衆即今和尚以何法示人師云滿眼滿耳乃云靈瑞優曇甚妙哉昔年開過又重開人人於此常遊玩一段清香風送來如優曇鉢華時一現耳若知諸佛義當觀時節因緣時節若至其理自彰以拄杖卓一卓云下坡不走快便難逢上堂問古云不生不滅既不生滅別去三周今在甚麼處師云春寒四十五進云寒後作麼生師云清明佳節來乃云無住僧尼去路甚奇魔宮虎穴左之右之以拂子拂云於此現身説法不可思議若向者裏薦得同遊寶明空海來去自由縱橫無礙其或沉吟終日忙忙無本可據解制上堂六十三年行腳逢緣且住六春將謂一場好事誰知禍及私門大衆且道行的是住的是良久以拄杖打圓相云啼得血流無用處不如緘口過殘春上堂問細雨濛濛點法臺雲峰此日復重開以手打圓相云且道者箇還有向上事也無師云有僧拂坐具云者箇是甚麼人境界師云兩重公案乃云大道現於目前翻為名相之境前塵分別是謂意根以法為體是謂法身神而明之存乎其人驀呈拄杖云仁者見之之謂仁智者見之之謂智法衣至上堂問遍界未曾隱諱毫端時現優曇多子塔前祕授何法師云一人傳虛進云恁麼則普天匝地一時成佛去也師云十人傳實乃云黃梅夜半親傳授大庾嶺頭提不起今日分明在我肩了無別法示諸子住南溪縣開元寺結制小參問鐘鼓頻敲聲聲不絶龍象整齊請師答話師云秖為分明極進云兩眼對兩眼師云翻思所得遲乃云大道本現成人人不覺知且現前諸物各各不相到各各不相知早已露頭露面了也汝不自悟取我求實正謂飯籮裏餓殺洋子江心渴殺將謂佛法別有奇特經論中穿鑿公案上尋討求玄求妙認他門頭戶口向意地下卜度知解上安排殊不知轉追轉遠苟能一旦知非一一放教乾乾淨淨思量觀察忽然看破始知本命元辰落處十方世界都是箇自己更有阿誰行住坐臥盡是本地風光咳唾掉臂也是西來大意終日騰騰任運出入自由無淨無染要行便行要坐便坐更莫遲疑倘信不及被目前境界奪去攀緣妄想無有了日逗到生死際頭眼光落地毫無主宰隨業引入閻羅案前喫鐵棒莫言不道解制小參僧以坐具打圓相云三世諸佛出不得者箇格子還有出得者麼師云布袋胡孫進云蝦跳不出斗師云果然問世尊拈花消息被學人看破師云試道看僧舞坐具師云識神變現問百尺竿頭如何進步師卓拄杖云會麼僧禮拜乃云囊括終古道達群芳亭毒蒼生疏而不漏安禪結制無繩自縛見性成佛好肉剜瘡若箇靈利衲僧來問老漢在者裏作甚麼呵呵大笑云不在打草只在驚蛇結制小參問長安風月貫今昔為甚麼立雪乞安心師云為你多事乃云今日結制來上堂但添爐中一瓣香觸碎諸人箇鼻孔能有幾箇不著忙不著忙者只得一邊如何是那一邊試道看維那舞坐具師云鄭州出曹門卓拄杖云豎起蒼蒼眉兩道鼻孔依然向下垂若不返觀內照徒勞朝參夜參正如窮子衣藏珍寶而自不識將謂佛法甚是奇特窮高極遠似掘地覓天苟能知非向根本上做去好不省力那裏是根本善念惡念經行坐臥穿衣喫飯頭頭上顯物上彰何等親切還委悉麼是法住法位世間相常住本師訃音至拈香云者漢無情生來傲物不秉毗尼打人入骨佛祖命脈全然不顧今之古之少人檢録我雖嗣伊不墮其數還委悉麼一年一度燒香日千古令人恨轉深落堂古人進堂三五日了明大事即今衆兄弟若有相應者山僧與你證明如無且向十二時中穿衣喫飯經行坐臥屙屎放尿處看是甚麼道理欲明此事直須痛念生死深懷慚愧要心清淨自然正念現前疑情頓發如一座山觸在面前宜猛著精彩深錐痛劄孜孜切切行不知行坐不知坐自然有箇相應倘若挨排度日如水泡石終無入處老僧於般若緣分素薄入道年晚三十有五才見本師誠恐此事不能搆每夜經行廊下那箇柱上不撞一頭那箇壁間不靠一靠如此剋苦數年才得相應依師十載無行不行無事不執二三十年來頃刻未嘗放過至於今日略得自由所謂憶昔當年騎竹馬兒時做出老知羞師云三界唯心人天本具若不明心焉能知道若明自心是名開佛知見一機一境大用現前見色聞聲全體獨露頭頭上了物物上明天地不能蓋載萬象莫能覆藏一道清虛靈光湛寂如此見得當下知歸情存限量落於見聞擬議思量白雲萬里還委悉麼大千沙界海中漚一切聖賢如電拂師云凡做工夫多被昏沉掉舉奪去所謂昏沉厚重難以策發掉舉猛利不可抑伏貪癡熾盛觸境難調直須猛著精彩端身正意不依氣息形骸但觀自心清淨本自不生外無少法可得如是漸漸調淳浸之既久沃之以熟自然觸發如拾舊物開門見山無不明了正好買草鞋行腳倘若氣質粗浮善根微劣於此事信不及疑情不生若不生疑難以進道所謂小疑小悟大疑大悟不疑不悟大發疑情自然徹去若疑信相半依稀混過眼前日子直到生死際頭做不得主七慌八亂悔之何及還知麼努力今生須了卻莫教永劫受餘殃師入堂適遇衆禪師向火師云向大火參大禪不知幾人得大意一衆無語師舉火筯云日間鬧炒炒夜間鬧炒炒一段大光明當面錯過了機緣師舉安祿山因緣維那呈頌云不見有假何處是真刀斬泥人血氣腥腥師接得復徵云是一箇是兩箇那禮拜了依位而立師云也是囫圇吞棗子一僧呈頌云寶劍從來斷不平用時誰許較疏親當陽一斫無回互瓦礫泥團盡喫驚師徵云上座將甚麼作寶劍僧便喝師和聲便打師入堂舉僧問夾山如何是夾山境山云猿抱子歸青嶂後鳥銜花落碧崖前後法眼云我二十年只作境會師云法眼恁麼道大衆作麼生會一僧喝師云與麼還未見法眼二十年後淆訛處在便歸方丈僧次日詣方丈請益云和尚昨日公案學人到者裏有箇見處師云試道看僧云猿抱子歸青嶂後青山歲歲還依舊鳥銜花落碧崖前緑水滔滔逝遠川師云者箇是錦上添花僧云若然者卻孤負夾山師云夾山在甚麼處僧撫掌一下師云未在僧拂袖便出師入堂微密維那問有一羅剎手執鐵叉專要殺佛害祖和尚作麼生回互師合掌云善哉那即𥅄目擎拳作執叉勢師云好箇捷疾鬼那作禮而退二僧才到卒然求見師云道得即見其僧不領憤然勇進師云道道僧一喝師云者箇是風力所轉僧桌上一掌師亂棒打出師看病僧問云如何是臨終不亂意師舉拳云向者裏會得自然不亂僧云不會乞示一偈師展掌云一拳舉出莫亂妄想擬議思量翻成巴掌除夜師云年年有月日日有夜千古意分明如何自不徹徹不徹紅爐點片雪錮鏴著生鐵年盡名臘月月盡三十夜戶戶挂門錢人人燒柏葉如是而見知何處有分別萬古長空一朝風月年盡三十日無常迅速急若過此關者日日是好日時時是好時且今夜香燭滿筵僧衆濟濟還有過得者麼試道一句看有僧一喝師云也是赤土塗牛奶頌古世尊初生初出母胎脫體張指天指地口喃喃縱然獨步群芳外一身猶恨不能藏雪山成道才到雪山先已錯何須冷地六年坐明星一點刺雙眸魑魅魍魎白日過達磨見武帝披肝露膽見梁王一語難投客思長不識元來無聖諦漫將蘆葦渡清江丹霞燒木佛十方世界一團冰寒極洎乎凍殺人木佛燒來通身暖躲根禪客沒卑尊本來面目覿面承當本不差芒鞋踏著是生涯珠回玉轉憑誰力切忌毋添眼裏沙女子入定禪非坐有定無自性文殊罔明均皆一頓國師三喚侍者平地起孤堆無風翻白浪一片老婆心令人生伎倆倩女離魂隻不隻來雙不雙微塵剎海亦能彰隨緣不覺露些子千古令人恨轉長諸可還者自然非汝不汝還者非汝而誰終日尋春不見春等間撥破嶺頭雲扶笻忽到荒郊外只見枝頭滿十分見見之時見非是見見猶離見見不能及見見之時見非照明暗色空俱不到見猶離見見非真楊修一覽便知妙偈示半偈禪人雲瓢酷暑走天涯將謂其中事有差萬象森羅常覿面闍黎切莫眼生花示復初禪人闍黎本是共家鄉佐助雲峰樹法幢今日與君分指去報恩祖道又重光示天運上人目前蠟燭透雲霄匝地光明豈肯饒若是尚留觀聽者小羅石在太和橋示無波大德古佛洞中真箇古平天花甲難窮數常將心眼示時人珍重時人宜薦取示三宗上座從豫聚首十餘年一段光明絶妙玄今日家風非昔日莫教狼籍落人間示純白禪人江風一葦透長安星月光寒天地間嶺畔子規啼未歇聲聲相送竹窗前送象崖法兄歸閩春風密密定無移放出優曇第一枝昔日雪峰輥毬處家風依舊任提持哭四維法兄好枝曇翼正芳菲風雨無情實可悲自古樞機原不動無端色相在春歸夢人請説法旃檀才爇玉爐煙朵朵祥雲飛白蓮觸碎娘生箇鼻孔幾人成怨幾人歡示井參王居士箇事如何舉似伊電光石火較猶遲若於棒上生荊棘錯過鋒前第一機示牟居士生死關頭一點疑眉毛廝結合如斯忽然踏破漆桶子滿目青黃又是誰僧無瑕請師方山住靜泉水乾枯師云我與此山無緣次日甘泉淙然而出乃為銘曰方山靈泉埋沒多年高卑任注不僅菴前人去水去人還水還隨汲多少任器方圓飲者沐者可知恩焉非我檀那長遠心難重修萬壽寺引大壩城東古寺頽屋破墻穿勢若危堂堂露出真金相颯颯風吹草木葳阿呵呵告檀那大家發帑來相助福祿如山不較多次我劬樊部臺賀師壽原韻聚頭十載豈無言吞吐饒君一勺先翠竹心光常自鑑溪聲法語在當然神丰凜凜嚴如雪氣宇昂昂志益堅莫謂塵中無異客祖師圖上有燈傳紅崖次伯府侯公韻幽深曲徑路橫斜老樹能開幾色花翠滴且憑天賜露香馨惟覺世紛華峰高倏有娘生面林鬱渾忘鳥道賒踏破白雲窮極目方知孤迥別人家避秦有感世道臨秋晚中華被亂風人心到處險物理勢難通共話窗前竹借居嶺後楓未逢穿耳客若箇話西東聖水寺招提名聖水殿後涌靈泉泠泠千年澤涓涓萬古寒源頭充屋角餘派入支川晝夜潺湲逝誰能不受瞞觀音草無住觀音處處現身淨水一瓶芳草青青無風自動刺人眼睛想是定中無別事又來草上展精神咄雪霽山九十九峰爾最奇聳然獨秀峭巍巍從來不借陽和力六月炎天有雪飛白塔玲瓏壁立插青天影落長江魚畏餐多少遊人不具眼臨風盡把作表看天池山頂名池天設成長年湛湛自澄清時邀皓月頻來往吞納森羅詎有心牛山臥月眠雲不計秋天然圖畫孰為儔分明頭角全身露往往牧童誤認牛迎水寺一江波涌挂珠簾曬錦分文蕩碧天古寺不消重造像水流説法在當然玉皇洞數仞巴焦石挂峰團圞中隱紫微宮風煙日月俱不到幾箇男兒識此宗響冰灘朝朝響水被人嫌誰信聲聲洞劫前直示與人肝膽句毋將喚作老婆禪觀音石拳頭大石現觀音草木橫披露一身縱有見聞如幻夢幾人到此肯相親興佛寺古佛久淹不計秋野花芳草似荒丘從今高豎法幢去鼠糞無教傾佛頭苦雨陰雨深沉霧不開淋淋滴滴動人懷天機歷落從空降點點靡從別處來水車有感機心才動一輪周陸續相依逐上流惡水平空繚亂潑璣珠顆顆出雲頭桃花春風一颯樹頭寒幾片殘紅落檻前翻憶靈雲得力句從教千古漫流傳中秋盡謂中秋月清光滿大唐者樣現成物何必更思量葵花百卉叢中占玉階全無枝葉自成才秋風秋雨難移志一片真心向日開書問復川南道吳公諱登啓近時士大夫談禪如道火何曾燒著口且喜檀越身居榮位志切山林法門深幸也來諭求一棒自揣凡骨不能承受俟水落石出或可親見本來面目耳檀越不得話作兩橛且道一棒與本來面目是一是二若是一何故凡骨不能承受若是二又非本來面目矣於此檢點得出做官即是做佛若檢點不出做官依舊做官承賜鼎扇飯僧敬此致謝答瀘陽衆居士供法衣衆居士送法衣與雲峰則雲峰無可受衆亦無可施無受無施實為無上福田矣若此信得則人人受福無盡如信不及卻被袈裟瞞了耶謹此云謝太守邢諱夢鶴下車以詩問師方山老衲住雲中拄杖崖巔對曉風片片桃花相間逐不知何處覓芳蹤答邢府尹次來韻老病相鄰臥室中誰知千里有同風長江如練天如洗幾箇於斯認影蹤太守邢公請薦嚴啓先嚴見背念有餘年回憶音容而今如在雖窆骨於下地猶抱恨以終天蜀嶺雲高陟岵瞻之不見峨峰雪滿居廬望之猶寒敢呈茹供於當前因求法言而主世存歿感佩永矢弗忘謹啓答袁鄉紳一粒米重如須彌山尋常只把作話柄誰知遇亂世荒年親證於此今幸檀越打開寶藏滿盤傾出色色鮮明顆顆香潔實為大施主矣鉢盂兩度溼毛孔七日香猶是化門語也楮謝不盡答邢府尹幾番過貴治擬欲登龍一晤恐其誤正是以為歉得展飛輪開函閲竟始知現宰官身提實相印優遊於物外真火宅中道人也喻云久較風幡山僧不知六祖道非風幡動仁者心動幡動心動亦皆是動試檢較看肅此申復併謝不宣行實一日衆入方丈請示行實師曰生來資質暗鈍錯用工夫恐誤後學衆曰從上諸聖皆有來由和尚慈悲以示來學師曰我係瀘州父姓李母趙於戊戌年六月初十日午時生先夜見日光照室母對父云房中自來暗何故日光來照又亦不知一歲父喪七歲時見窗前人影驚疑人生有此影人死影歸何處在山土崩在水水流又在何處自己怕生死呆呆十餘日母罵曰此兒養憨了混於群兒隊中頑滑忘了此境凡自己行見風搖木作聲此境現前十五歲白母出家二十五歲遊歷講肆三十五參雙桂老人乃問學人痛念生死乞師開示老人曰汝作法師經中種種方便還要我方便豫云佛之方便雖多不知那句得力老人云唯佛與佛乃能知之知箇甚麼豫云不會苦參七箇月忽然病目數夜未睡象崖云眼以睡為食何不睡覺粥後睡至午時梆聲驚醒方才伸腳如登脫一塊大石不見山河大地殿宇房舍惟見一段紫光少頃不見通身慶快兩眼如舊對相知説象崖云此是識神變現不可取著從此妄想不生工夫做不上清清冷冷四十餘日從前經論公案零零碎碎不知悟了多少一日止靜維那分咐香燈不可放宜興壺在佛前你只説他是泥塑木雕豫不覺踏翻漆桶大汗如洗至開靜進方丈白老人云學人昔時聞説無一物信不及果然今日無一物老人云你無一物者一問從何處來豫云和尚從何處答老人微笑豫作禮老人劈頭一踏云石人腰帶老人住中慶豫職維那一日陪客喫茶二僧從內江過有一僧化緣説是堂中人傍僧説和上那的也有人豫云你不知遍大地是箇和尚老人云你不曉得那箇是真和尚豫云還有箇真假在老人云汝還辨別不出豫不覺慚愧失色靈筏云若知真和尚大衆請喫茶少頃老人引話道饒州燒磁器釉子在黃山出有兩樣惟家識得者箇石將來塗坯才釉若不識此石怎得釉豫當時疑悶一夜至天明偶然透得者公案早粥畢老人落堂云往年有供養沒好僧今年有好僧沒供養豫鼓兩袖而出老人云謝供養依老人十載不離左右日聽玄音一日解制老人將源流拂子萬峰院事付囑豫辭曰學人屢生福薄現居學地敢當大任辭脫院事出萬峰今日因衆數數逼我不覺露出者一絡索不知臉皮厚多少一衆禮謝而退分燈藏舟普澤禪人從來義虎出西川數載相依非偶然火爐句子親叮囑任君倒弄與顛拈清素德訥禪人再來人物不可知一語投機卻便歸拂子一枚親授受家風原要汝扶持嘯虛性空禪人豫事萬峰十載餘性空志節倍於師因緣相遇難回避紹續楊岐第一枝淡玄方瑤禪人南泉尋指一株花舉示時人如幻夢信手拈來贈似君闍黎從教機先用微密道深禪人行腳曾經二十年雲峰始售草鞋錢住山莫道無山住火種刀耕總聽緣湛一續清禪人從來佛法無多子莫謂久常難得人今向火爐分半偈渠儂亦任展風雲佛事為寶珠火寶珠大德自性殊絶今朝歸去光圓滿月咦還識路頭麼烈火焰中明皎潔攛下火炬為明脫火明脫明脫到處快活一道圓明秋光閃爍老僧助汝一把火赤條條紅灼灼五色雲中飛一鶚為海澄火曹溪舂碓背負石者僧全用一身力見諦頓超衆行門火聚之中知端的為微密火四大本空五蘊非有任緣而去無可不可攛火炬云吾今相助光明幢猛火聚中淨裸裸為三宗火汝年六十七戒臘四十三今朝歸去也光射斗牛寒以火炬打圓相云夢幻空花留不住大千沙界任往還為三空火生年七十七行業皎如日打破生死關清光照天地老僧更助汝一程火光三昧恣遊戲為參己火參己禪人操履已畢得路便行三界遊戲攛火炬云𠰚為雲封火生號雲封死則火封生死去來不離其中然雖如是只得一通吾今助汝一把火燒得淨裸裸絶羅籠
