front:
  text: 雲峰體宗寧禪師語録敘體宗先兄和尚悟真履實道德之風洋溢於蜀黔甚久德玉於未剃染初竊響慕之欲求為披剃師而不可得易菴大吼遺聞諸兄親炙錘拂之下而室中皆不肯可康熙甲子秋蜀東南亢旱豫於華岩散衆逆流而上禮吾兄之塔衆留結冬乙丑春解制衆又留結夏時豫乃問諸知事云先兄開法於斯幾二十年語録何在監寺遂舉以示豫捧讀再三而不忍釋遂命諸梓蓋先兄不喜人記録其語亦不許刻行隄岸甚牢故其入寂滅定十餘年而此録猶未流通豫不忍埋沒先兄數十年之赤心片片與夫悟真履實之光明舍玉其誰與顯康熙乙丑歲孟夏浴佛日華岩法弟德玉謹敘序昔波若多羅觀震旦國有大乘根器所以壁觀婆羅門航海而來直指人心見性成佛名曰教外別傳殊不知多了一番事何也𠰚大地衆生本來清淨何用指為不見道心佛及衆生是三無差別數百年來許多血氣男兒入其綣繢支派繁衍而返曲別傳之旨者不甚枚舉惟我得戒體宗寧和尚自負萬峰破山師翁鉢袋隱逸多年初有不出人前之語順治間蜀南瀘陽被一班好事宰官紳襟緇素請主方山雲峰禪院迫不得已拽杖而應接納四來一味惡辣鉗錘剿絶𦆆纖只教生蛇脫殼青鳧化鳳師戊戌六秩大年徹生詣座圓具曾遭毒手脫皮換骨另具一隻眼始知山河大地草木叢林頑石土塊盡屬吾人心垢也時奉昭覺本師命下嘉禾刊錦江燈録附藏流通有法兄湛一將師語録稿自蜀遠寄命生壽梓不敢相違爰抽路費之餘刻入楞嚴經坊行世以報恩於萬一云時康熙乙亥正陽佛誕之吉青城法姪徹生薰沐敬撰
